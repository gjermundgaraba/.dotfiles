onboarding = false

[theme.custom]
accent = "#ffd60a" # vivid gold for the active-pane border

[terminal]
# Keep macOS login-shell PATH behavior when using Fish.
default_shell = "fish"
shell_mode = "auto"

[keys]
prefix = "f20"
settings = "prefix+shift+s"
open_notification_target = "" # prefix+o is used by Herdr History

goto = "" # prefix+g is used by clankersnip
new_workspace = "prefix+shift+c"
remove_worktree = "prefix+backspace"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
focus_agent = "prefix+alt+1..9"

previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"

copy_mode = "prefix+space" # prefix+[ is awkward on Norwegian keyboards
focus_pane_left = ["prefix+h", "cmd+alt+h"]
focus_pane_down = ["prefix+j", "cmd+alt+j"]
focus_pane_up = ["prefix+k", "cmd+alt+k"]
focus_pane_right = ["prefix+l", "cmd+alt+l"]
split_vertical = ["prefix+d", "prefix+v"]
split_horizontal = ["prefix+shift+d", "prefix+s"]
zoom = "prefix+m"

# Forward these chords into Vim/Neovim when focused; otherwise move between Herdr panes.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "gjermundgaraba.herdr-picker.agents"
description = "agents"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "gjermundgaraba.herdr-fork-to-pane.fork"
description = "fork agent into right pane"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "gjermundgaraba.herdr-history.back"
description = "History back"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "gjermundgaraba.herdr-history.forward"
description = "History forward"

[ui]
sidebar_width = 32
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[experimental]
# Pane history persists terminal contents and may include secrets.
pane_history = true
kitty_graphics = true

[advanced]
scrollback_limit_bytes = 52428800

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "gjermundgaraba.herdr-picker.open"
description = "resource picker"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "gjermundgaraba.herdr-picker.workspaces"
description = "workspace picker"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "gjermundgaraba.clankersnip.open"
description = "snippets"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec fish"
description = "open native Fish popup terminal"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = 'ref="$HERDR_ACTIVE_PANE_ID"; "${HERDR_BIN_PATH:-herdr}" agent get "$ref" >/dev/null && printf "%s" "$ref" | pbcopy && "${HERDR_BIN_PATH:-herdr}" notification show "Copied agent reference" --body "$ref"'
description = "copy active agent reference"
