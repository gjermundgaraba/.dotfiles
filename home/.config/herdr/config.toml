onboarding = false

[terminal]
default_shell = "fish"
shell_mode = "auto"
kitty_graphics = true

[keys]
prefix = "f20"
settings = "prefix+comma"
open_notification_target = ""

goto = "prefix+n"
new_workspace = "prefix+shift+c"
new_worktree = "prefix+shift+b"
open_worktree = "prefix+b"
remove_worktree = "prefix+backspace"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
focus_agent = "prefix+alt+1..9"

new_tab = "prefix+t"
previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"

copy_mode = "prefix+space"
focus_pane_left = ["prefix+h", "cmd+alt+h"]
focus_pane_down = ["prefix+j", "cmd+alt+j"]
focus_pane_up = ["prefix+k", "cmd+alt+k"]
focus_pane_right = ["prefix+l", "cmd+alt+l"]
swap_pane_left = "cmd+alt+shift+h"
swap_pane_down = "cmd+alt+shift+j"
swap_pane_up = "cmd+alt+shift+k"
swap_pane_right = "cmd+alt+shift+l"
split_vertical = ["prefix+d", "prefix+v"]
split_horizontal = "prefix+shift+d"
zoom = "prefix+z"
close_pane = "prefix+shift+x"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[ui]
sidebar_width = 32
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

status_indicators = "dots"
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 52428800

[update]
version_check = false

[[keys.command]]
key = "cmd+shift+t"
type = "popup"
command = "exec fish"
description = "open native Fish popup terminal"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = '''pane=$HERDR_ACTIVE_PANE_ID
[ -n "$pane" ] || exit 0
herdr="${HERDR_BIN_PATH:-herdr}"
session=$("$herdr" pane get "$pane" | python3 -c 'import json,sys; p=(json.load(sys.stdin).get("result") or {}).get("pane") or {}; s=p.get("agent_session") or {}; print(s.get("value") or "")')
if [ -z "$session" ]; then
  "$herdr" notification show "No agent session" --body "$pane"
  exit 0
fi
printf "%s" "$session" | pbcopy
"$herdr" notification show "Copied agent session" --body "$session"
'''
description = "copy active agent session id"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = 'printf "%s" "$HERDR_ACTIVE_PANE_ID" | pbcopy && "${HERDR_BIN_PATH:-herdr}" notification show "Copied pane id" --body "$HERDR_ACTIVE_PANE_ID"'
description = "copy active agent reference"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = 'printf "%s" "$HERDR_ACTIVE_PANE_CWD" | pbcopy && "${HERDR_BIN_PATH:-herdr}" notification show "Copied pane path" --body "$HERDR_ACTIVE_PANE_CWD"'
description = "copy active pane path"

[ui.sound]
enabled = false

