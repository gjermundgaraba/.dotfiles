onboarding = false

[terminal]
# Keep macOS login-shell PATH behavior when using Fish.
default_shell = "fish"
shell_mode = "auto"

[keys]
prefix = "f20"
settings = "prefix+comma"
open_notification_target = "" # prefix+o is used by Herdr History

goto = "prefix+n" # prefix+g is used by clankersnip
new_workspace = "prefix+shift+c"
new_worktree = "prefix+shift+b"
open_worktree = "prefix+b"
remove_worktree = "prefix+backspace"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
focus_agent = "prefix+alt+1..9"

new_tab = "prefix+t"
previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"

copy_mode = "prefix+space" # prefix+[ is awkward on Norwegian keyboards
focus_pane_left = ["prefix+h", "cmd+alt+h"]
focus_pane_down = ["prefix+j", "cmd+alt+j"]
focus_pane_up = ["prefix+k", "cmd+alt+k"]
focus_pane_right = ["prefix+l", "cmd+alt+l"]
swap_pane_left = "cmd+alt+shift+h"
swap_pane_down = "cmd+alt+shift+j"
swap_pane_up = "cmd+alt+shift+k"
swap_pane_right = "cmd+alt+shift+l"
split_vertical = ["prefix+d", "prefix+v"]
split_horizontal = "prefix+shift+d"
zoom = "prefix+z"
close_pane = "prefix+shift+x"

# Forward these chords into Vim/Neovim when focused; otherwise move between Herdr panes.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "herdr-picker run agents"
description = "agents"
width = "88%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "gjermundgaraba.herdr-fork-to-pane.fork"
description = "fork agent into right pane"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "gjermundgaraba.herdr-history.back"
description = "History back"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "gjermundgaraba.herdr-history.forward"
description = "History forward"

[ui]
sidebar_width = 32
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$numbered_workspace", bold = true, dim = false }],
  ["$branch_line", "git_status"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[experimental]
# Pane history persists terminal contents and may include secrets.
pane_history = true
kitty_graphics = true

[advanced]
scrollback_limit_bytes = 52428800

# Custom fork build (see ~/ws/pers/forks/herdr); silence update nags so
# `herdr update` doesn't get run reflexively and clobber the patched binary.
[update]
version_check = false

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "herdr-picker run workspaces"
description = "workspace picker"
width = "88%"
height = "80%"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "gjermundgaraba.clankersnip.open"
description = "snippets"

[[keys.command]]
key = "cmd+shift+t"
type = "popup"
command = "exec fish"
description = "open native Fish popup terminal"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = 'printf "%s" "$HERDR_ACTIVE_PANE_ID" | pbcopy && "${HERDR_BIN_PATH:-herdr}" notification show "Copied pane id" --body "$HERDR_ACTIVE_PANE_ID"'
description = "copy active agent reference"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = 'printf "%s" "$HERDR_ACTIVE_PANE_CWD" | pbcopy && "${HERDR_BIN_PATH:-herdr}" notification show "Copied pane path" --body "$HERDR_ACTIVE_PANE_CWD"'
description = "copy active pane path"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "herdr-picker run agents-unseen"
description = "jump to agent, mark this pane unseen"
width = "88%"
height = "80%"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
description = "history back, mark this pane unseen"
command = '''origin=$HERDR_ACTIVE_PANE_ID
[ -n "$origin" ] || exit 0
"${HERDR_BIN_PATH:-herdr}" plugin action invoke gjermundgaraba.herdr-history.back || exit 0
python3 - "$origin" <<'PY'
import json, os, socket, sys, time

origin = sys.argv[1]

def rpc(method, params):
    with socket.socket(socket.AF_UNIX) as conn:
        conn.connect(os.environ["HERDR_SOCKET_PATH"])
        conn.sendall((json.dumps({"id": "back-unseen", "method": method, "params": params}) + "\n").encode())
        return json.loads(conn.makefile().readline())

# plugin.action.invoke returns when the plugin starts, not finishes: poll
# until the back jump actually moves focus off the origin pane.
deadline = time.monotonic() + 2
while True:
    focused = rpc("session.snapshot", {})["result"]["snapshot"].get("focused_pane_id")
    if focused not in (None, origin):
        error = rpc("pane.mark_unseen", {"pane_id": origin}).get("error") or {}
        sys.exit(0 if not error or error.get("code") == "pane_not_idle" else 1)
    if time.monotonic() >= deadline:
        sys.exit(0)  # no jump landed (at oldest, or history inactive)
    time.sleep(0.02)
PY'''

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "herdr-picker-move-pane.py"
description = "move pane to tab"
width = "88%"
height = "80%"

[ui.sound]
enabled = false

