[[snippet]]
title = "grilling"
text = """
Interview me thoroughly until we agree on the goal, scope, and design. Track decisions and their dependencies as a design tree.

Ask manageable batches of numbered questions whose prerequisites are settled. For each, give your recommended answer, relevant choices, and significant tradeoffs, especially added complexity. Wait for my answers before asking dependent questions.

Look up accessible facts yourself; delegate when useful. Bring design decisions to me rather than silently choosing for me.

Continue until the decisions needed for the agreed scope are settled and deferred questions are explicit. Summarize our shared understanding and ask for confirmation before acting.
"""

[[snippet]]
title = "light-grilling"
text = """
Interview me until we agree on the goal, scope, and key decisions. Focus on questions whose answers would materially change the approach or outcome. Skip minor details, unlikely edge cases, and decisions that can safely wait.

Ask a few concise, numbered questions per round, each with your recommended answer and any significant tradeoff. Only ask questions whose prerequisites are settled, then wait for my answers before the next round.

Look up facts yourself. Use sensible defaults for minor details and briefly state any assumptions that matter.

Once the important decisions are settled, summarize our shared understanding and ask for confirmation before acting.
"""

