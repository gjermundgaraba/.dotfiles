[[snippet]]
title = "· review validation core"
text = """
Validate every substantive finding against relevant evidence. {snippet:· adversarial stance} Evaluate whether the underlying issue warrants change, independently of the proposed solution. Give your own judgment on subjective findings; do not assess severity or classification labels.

Preserve original IDs, order, and section boundaries. Cover each finding once, giving concise, evidence-based steelman arguments for fixing and dismissing it, followed by **Fix**, **Partial**, or **Dismiss**. Use **Partial** when only part of a finding is valid and specify which part. Note material factual corrections and verification limits.

Do not propose specific solutions or edit files.
"""

[[snippet]]
title = "deslop review"
text = """
$deslop
Review {scope} for correctness and worthwhile simplifications in code and architecture. 
Identify concrete opportunities to improve maintainability, reduce hand-rolled solution and product constraints that are unnecessarily restrictive.
Do not assume all requirements and special cases need to be maintained, especially if removing them opens up opportunities.

Do not edit files."""
args = [{ name = "scope", default = "uncommitted changes" }]
