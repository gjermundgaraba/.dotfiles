[[snippet]]
title = "solution finding"
text = """
Propose simple, durable solutions to these issues, including worthwhile cleanups. Churn and breaking compatibility are acceptable.
Prefer reduced complexity, simpler solutions, design and code where feasible.
Also suggest loosening up overly strict requirements if it can help with reducing complexity or open up the path for cleaner designs or less hand-rolled solutions.

Do not edit files."""

[[snippet]]
title = "simplification audit"
text = """
Perform a read-only, repo-wide simplification audit. Find hand-rolled code that could be replaced by, in order of preference: standard-library or platform features, idiomatic language/framework patterns, existing dependencies, or well-maintained libraries. Search for new libraries when a concrete opportunity warrants it.
Report only worthwhile opportunities. For each, include file locations, the proposed replacement, expected benefit, tradeoffs, and confidence. Verify behavior and call sites first; reject changes that merely trade local code for dependency or abstraction overhead.

Churn and breaking compatibility are acceptable.
Also suggest loosening up overly strict requirements if it can help with reducing complexity or open up the path for cleaner designs or less hand-rolled solutions.

Do not edit files."""

