# clankersnip snippets — hot-reloaded on save
#
# Placeholders: {clipboard} {date} {date:%H:%M} {uuid} {cursor}
# Unknown {braces} are left as-is, so code snippets are safe.
#
# Arguments: declare them on a snippet, reference them in text as {name}.
# An arg with a default is optional; without one it must be filled.
# Types: string (default), number (whole number), list (comma-separated
# input, re-joined with `separator`, default ", ").
#
# Example:
#   [[snippet]]
#   keyword = ";deploy"
#   text = "deploy {env} --retries {retries} {targets}"
#   args = [
#     { name = "env" },                                          # required string
#     { name = "retries", type = "number", default = "1" },      # optional number
#     { name = "targets", type = "list", separator = "\n" },     # newline-joined list
#   ]

[[snippet]]
title = "clankersnip test"
keyword = ";cst"
text = "clankersnip works: {date:%Y-%m-%d %H:%M} clipboard=[{clipboard}]"

