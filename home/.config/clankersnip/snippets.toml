[[snippet]]
title = "grilling"
text = """
Interview me relentlessly until we reach a shared understanding. Map this as a **design tree**: every decision branches into the decisions that hang off it.

Work the tree in **rounds**. The **frontier** is every decision whose prerequisites are already settled — the questions you can ask _now_ without guessing at answers you haven't heard yet. Ask the whole frontier in one round: number each question and give your recommended answer. Then wait for the user's answers before the next round.

Each question should be formatted like so:

```
❓ **Q1** - **<question title>**: <question body, might be multiple paragraphs, including multiple choices>
<!-- IF MULTIPLE CHOICES, _ALSO_ LIST THEM HERE LIKE THIS: -->
- a: <choice a>
- b: <choice b>
etc

➡️ <your recommended answer>
```

Each round the answers reshapes the tree — settled decisions push the frontier outward and unblock questions that depended on them. Recompute the frontier and ask the next round. A question whose answer depends on another question still open in this round belongs to a _later_ round, not this one.

Finding _facts_ is your job, never mine! When a frontier question needs a fact from the environment (filesystem, tools, etc.), dispatch a sub-agent to find it — don't ask me for anything you could look up yourself. The _decisions_ are mine — put each to me and wait.

The session is done when the frontier is empty: every branch of the design tree visited, nothing left silently assumed. Do not act on it until I confirm we have reached a shared understanding.

Whenever a specific choice has important tradeoffs that would increase complexity significantly, note that.
"""

[[snippet]]
title = "review review"
text = """
{snippet:· agent handoff}

Validate every substantive finding against the relevant code, tests, documentation, and runtime behavior. Gather any context needed to make an informed judgment.

Take an adversarial stance: the reviewer may be wrong, lack context, or propose work that is not worthwhile. Do not assess the review's severity or classification labels.

For every finding:
- Steelman the case for fixing it.
- Steelman the case for dismissing it.
- Give a verdict: **Fix**, **Partial**, or **Dismiss**.
- Use **Partial** when only part of a composite finding is valid, and state exactly which part.
- For subjective findings, give your own judgment.
- Evaluate whether the underlying issue warrants change, not whether the reviewer's proposed solution is correct.

Use this output structure:

# Validation result

Briefly state what was validated, followed by:
- Finding verdict counts.
- Any important scope qualifications.
- Confirmation that no files were changed.

Define the verdict meanings in one short paragraph.

## Important reviewer corrections

List only material factual errors, unsupported claims, or scope corrections. Omit this section if there are none.

# Findings

Preserve the review's original IDs, ordering, and natural section boundaries. Use one Markdown table per original section; if the review has no sections, use a single table:

| ID | Steelman for fixing | Steelman for dismissing | Verdict |
|---|---|---|---|

Keep each cell concise but specific and evidence-based. Every substantive finding must appear exactly once.

If the review includes separate cleanup proposals, architectural proposals, or an overall line-count/dependency claim, evaluate those in separate sections using the same table structure.

End with:

**Current state:** validation complete, no implementation started, no files changed.

Do not propose specific solutions. Do not make edits or changes.
"""
args = [
  { name = "thing", default = "a review" },
  { name = "tag", default = "agent-review" },
]

