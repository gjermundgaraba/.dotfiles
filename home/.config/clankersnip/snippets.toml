[[snippet]]
title = "· use herdr"
text = "Use Herdr to drive other agents yourself; I will not relay messages between you."

[[snippet]]
title = "· driver mechanics"
text = """
Before starting, inspect staged, unstaged, and untracked changes. Identify existing task changes and include them deliberately. Preserve unrelated work and exclude it from task commits and review scope. Ask only if ownership is unclear.

Keep briefs, reports, and a findings ledger in a new run directory outside the repository: ~/.local/state/agent-runs/<repo>/<timestamp>/. The ledger records each finding's source, your verdict (Fix, Partial, or Dismiss), your reasoning, and its status. Save the workflow instructions you received, with their argument values, to instructions.md in the run directory at the start. After any compaction, re-read instructions.md and the ledger before continuing.

For each review round:

- Create a new herdr tab in the current workspace with the repository as its working directory and a label naming the run and round. Split it so each reviewer gets its own pane, start each reviewer with `herdr agent start --kind`, and never reuse a reviewer across rounds.
- Write one brief per reviewer containing its name, review instructions, reviewer rules, agreed goals, acceptance criteria, and relevant constraints. Reference existing context documents by absolute path where useful.
- In subsequent briefs, include prior findings relevant to the current scope, unresolved or cross-cutting findings, and the absolute ledger path for further inspection. Ask reviewers to verify resolutions, challenge dismissals they disagree with, and report new findings.
- Start each reviewer's prompt with each of these skills: {skills}, using `/<skill>` for Claude Code and `$<skill>` for Codex, followed by "Read <absolute brief path> and follow it."
- Reviewer rules: stay read-only. Do not ask questions; state assumptions in the report. Write the full report to <run directory>/<round>-<name>.md and reply with only that path.
- Request the report file in the initial prompt; this intentionally overrides the Herdr skill's guidance to use file output only as a fallback.
- Do not end your turn after dispatching. Wait in the background. A reviewer is finished only when it is idle or done and its completed report file exists.
- Handle reviewer prompts within existing authorization; use the approval gates otherwise.
- For a stalled reviewer, allow one re-prompt, then one fresh replacement per reviewer per round. If the replacement also cannot complete, stop and report the unavailable reviewer, concrete blocker, and results already collected. Do not claim complete review coverage.
- Read reports from the files, not pane scrollback. Close the tab after reading all reports."""

[[snippet]]
title = "· driver round"
text = """
Review instructions for the briefs: review the scope for correctness and worthwhile simplifications in code and architecture. Identify concrete opportunities to improve maintainability and reduce hand-rolled solutions and unnecessarily restrictive product constraints. Do not assume every requirement and special case must be kept. In each brief, provide the exact repository path, branch, commit range or uncommitted-change scope, and material deviations from the plan. Ask reviewers to check incomplete requirements and defects, verifying implementation-summary claims against the actual changes.

After each round:

1. Validate every finding against the code. {snippet:· adversarial stance} Judge whether the underlying issue warrants change, independently of the proposed solution, and record Fix, Partial, or Dismiss in the ledger. Reconsider a dismissal when a reviewer pushes back with new evidence.
2. For Fix and Partial findings, choose simple, durable solutions, including worthwhile cleanups. Churn and breaking compatibility are acceptable; prefer reduced complexity and less hand-rolled code.
3. Implement them and rerun the checks they affect.

Keep implementation within the requested task and review scope, including directly necessary cleanups. Record worthwhile findings outside that scope separately rather than implementing them without authorization."""

[[snippet]]
title = "· driver stop rule"
text = "Continue for at most 3 rounds of the same scope. Stop clean when a round requires no further changes, no accepted Fix or Partial finding remains unresolved, and any required checks pass for the current state. Dismissed findings do not block completion. At the cap, report unresolved findings and decisions, unverified work, and failing checks; do not describe that result as clean."

[[snippet]]
title = "· driver gates"
text = """
Make fix and dismissal decisions yourself. Honor decisions already authorized in the agreed plan or this conversation. Ask only about new consequential choices outside that authorization, before:

- loosening a requirement, removing a feature, or reducing required documentation or test coverage;
- choosing between product or API options that change user-facing behavior;
- anything outward-facing or hard to reverse, such as pushing, opening PRs, publishing, deploying, or installing;
- steps only I can do, such as unlocking 1Password, sudo, or logging in.

When asking, give the context, the options, and your recommendation, then resume after my answer."""

[[snippet]]
title = "· driver report"
text = """
Summarize the rounds run, what changed, material dismissals with reasoning, all unresolved findings, and verification results and limits. Link the complete ledger for the full finding history. Distinguish checks you ran from checks reported by reviewers. For each, identify who ran it, the command, the tested revision or worktree state, the result, and any verification limits.

Use a result as evidence for the final state only when the tested state still applies. Rerun checks when changes, failures, or unresolved concerns justify it; otherwise reuse applicable evidence."""

[[snippet]]
title = "· adversarial stance"
text = "Assess independently; the supplied analysis may be incorrect, incomplete, or not worth acting on."

[[snippet]]
title = "· agent handoff"
text = """
We got {thing} from another agent:
<{tag}>
{clipboard}
</{tag}>"""

[[snippet]]
title = "· review validation core"
text = """
Validate every substantive finding against relevant evidence. {snippet:· adversarial stance} Evaluate whether the underlying issue warrants change, independently of the proposed solution. Give your own judgment on subjective findings; do not assess severity or classification labels.

Preserve original IDs, order, and section boundaries. Cover each finding once, giving concise, evidence-based steelman arguments for fixing and dismissing it, followed by **Fix**, **Partial**, or **Dismiss**. Use **Partial** when only part of a finding is valid and specify which part. Note material factual corrections and verification limits.

Do not propose specific solutions or edit files.
"""

