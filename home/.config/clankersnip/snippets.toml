[[snippet]]
title = "grilling"
text = """
Interview me relentlessly until we reach a shared understanding. Map this as a **design tree**: every decision branches into the decisions that hang off it.

Work the tree in **rounds**. The **frontier** is every decision whose prerequisites are already settled — the questions you can ask _now_ without guessing at answers you haven't heard yet. Ask the whole frontier in one round: number each question and give your recommended answer. Then wait for the user's answers before the next round.

Each question should be formatted like so:

```
❓ **Q1** - **<question title>**: <question body, might be multiple paragraphs, including multiple choices>
<!-- IF MULTIPLE CHOICES, _ALSO_ LIST THEM HERE LIKE THIS: -->
- a: <choice a>
- b: <choice b>
etc

➡️ <your recommended answer>
```

Each round the answers reshapes the tree — settled decisions push the frontier outward and unblock questions that depended on them. Recompute the frontier and ask the next round. A question whose answer depends on another question still open in this round belongs to a _later_ round, not this one.

Finding _facts_ is your job, never mine! When a frontier question needs a fact from the environment (filesystem, tools, etc.), dispatch a sub-agent to find it — don't ask me for anything you could look up yourself. The _decisions_ are mine — put each to them and wait.

The session is done when the frontier is empty: every branch of the design tree visited, nothing left silently assumed. Do not act on it until I confirm we have reached a shared understanding.

Whenever a specific choice has important tradeoffs that would increase complexity significantly, note that.
"""

[[snippet]]
title = "review review"
text = """
We got a review from another agent:
<agent-review>
{clipboard}
</agent-review>

Consider the review, validate the findings and if they worth doing/updating for (but make sure to take a adversial stance instead of just accepting them as correct or worth fixing - the reviewer might be wrong or miss some important context), then make an argument for each finding: fix or dismiss. Make a steelman argument for both sides.  Do not review the classification or severity rankings themselves - only validate the findings and if they are worthwhile issues to consider doing something about.
For findings that are not correctness issues, but more subjective, give your own opinion based on your own judgement (gathering any relevant context you need to make a judgement)

Do not propose any specific solutions yet. Do not make any edits or changes.
"""

