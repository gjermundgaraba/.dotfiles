title = "deslop review"
text = "{snippet:· deslop} Review {scope} for correctness and worthwhile simplifications in code and architecture. Identify concrete opportunities to improve maintainability, reduce hand-rolled solution and product constraints that are unnecessarily restrictive. Do not assume all requirements and special cases need to be maintained, especially if removing them opens up opportunities. Do not edit files."
args = [{ name = "scope", default = "uncommitted changes" }]
