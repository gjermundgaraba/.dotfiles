[[snippet]]
title = "concrete impl plan"
text = """
Turn this into a concrete implementation plan for a prelaunch project: there are no users or deployments, so omit compatibility fallbacks and migrations.

Prefer simple, readable code and abstractions that reduce complexity. Respect existing sources of truth and module boundaries. Give mutable state a clear owner and make lifecycle requirements explicit. Isolate dependencies and translate errors where the boundary benefits callers; avoid layers that merely move complexity.

Rely on established internal invariants; validate untrusted inputs and handle relevant failure modes. Remove superseded paths and implementation leftovers. Test meaningful behavior and integrations, avoiding tests of library internals and unnecessary mocks.

Produce a standalone handoff an independent implementer can execute without prior context. Include:

- The problem, target outcome, and relevant code areas.
- Ordered implementation steps, without commit or PR planning.
- Material decisions, assumptions, and implementation constraints.
- Focused verification and relevant documentation updates.
- Risks and non-goals only where they affect implementation.

Ask about ambiguity that would materially change the approach before finalizing the plan; otherwise state reasonable assumptions. Do not implement the plan yet.
"""

# Drive snippets: Herdr and Deslop apply to the driver; the skills argument
# selects reviewer skills.
[[snippet]]
title = "drive plan"
text = """
{snippet:· herdr} {snippet:· deslop}
{snippet:· use herdr}

Develop a concrete implementation plan for {goal}. You are the planner. Review it with {reviewers}.

Inspect the relevant implementation, consumers, and project instructions. Inspect enough of the code to ask informed questions, then run a brief scoping interview.

Ask a small batch of concise, numbered questions—usually 2–3—about the intended outcome, scope, user experience, constraints, or tradeoffs that would materially change the plan. Give your recommended answer, relevant alternatives, and significant tradeoffs.

Reuse settled decisions and look up accessible facts yourself. Use sensible defaults for minor details. Wait for my answers before asking dependent questions; ask follow-ups only when material gaps remain.

Briefly summarize the agreed direction and important assumptions before drafting the plan.

Write the draft plan in the run directory. Include the goal, acceptance criteria, scope, ordered milestones, relevant code areas, ownership boundaries, material decisions, and required verification.

{snippet:· driver mechanics}

In each brief, provide the absolute draft-plan path and relevant repository context. Ask reviewers to assess correctness, feasibility, completeness, unnecessary complexity, and simpler alternatives against the goals and existing code. In subsequent briefs, include the updated plan.

Validate their findings independently and record Fix, Partial, or Dismiss with reasoning. Revise the plan for accepted findings.

Use bounded spikes or prototypes when they would resolve material uncertainty. Keep them in the run directory and report their evidence and limitations.

{snippet:· driver stop rule}

{snippet:· driver gates}

Finish with the standalone plan, the rounds run, material review dispositions with reasoning, unresolved questions and findings, and verification results and limits. Link the complete ledger for the full finding history. Ask for approval before product implementation. Do not modify product files or commit.
"""
args = [
  { name = "goal", default = "the task we discussed" },
  { name = "reviewers", default = "one Claude Code and one Codex" },
  { name = "skills", default = "deslop" },
]

[[snippet]]
title = "drive review loop"
text = """
{snippet:· herdr} {snippet:· deslop}
{snippet:· use herdr}

Run review rounds on {scope} until they come back clean. You are the implementer: apply the fixes yourself. Each round, review with fresh reviewers: {reviewers}.

{snippet:· driver mechanics}

{snippet:· driver round}

{snippet:· driver stop rule}

{snippet:· driver gates}

Leave all changes uncommitted.

{snippet:· driver report}
"""
args = [
  { name = "scope", default = "the uncommitted changes" },
  { name = "reviewers", default = "one Claude Code and one Codex" },
  { name = "skills", default = "deslop" },
]

[[snippet]]
title = "drive implementation"
text = """
{snippet:· herdr} {snippet:· deslop}
{snippet:· use herdr}

Implement {plan} end-to-end. You are the implementer. Continue without waiting for me.

Before starting, record the current HEAD in the run directory as the base commit, then decide how to split the work. If the plan is small enough to implement and review well as one change, do it in a single round: implement it, run the repository's required checks, and commit it, without a separate milestone review. Otherwise, implement it as ordered milestones, each a coherent, independently verifiable step. Use the plan's milestones where they are reasonable; otherwise split or re-split the plan. Record the chosen split and its rationale in the run directory.

For each milestone:

1. Implement it and run the repository's required checks.
2. Commit it as one milestone commit.
3. Run a single review round, without re-review, on that milestone's commit range, and commit the fixes as separate review-fix commits. Use fresh reviewers: {milestone_reviewers}.

A milestone is complete once its single review has been adjudicated, accepted fixes are applied, required checks pass for the resulting state, and the milestone and review-fix commits are recorded.

After the single-round commit or the last milestone, run review rounds on the total diff from the base commit, committing fixes as review-fix commits. Each round, review with fresh reviewers: {reviewers}. {snippet:· driver stop rule}

Follow the repository's commit conventions, sign as configured, and add no AI attribution. Do not push.

{snippet:· driver mechanics}

{snippet:· driver round}

{snippet:· driver gates}

{snippet:· driver report}
"""
args = [
  { name = "plan", default = "the plan we agreed on" },
  { name = "reviewers", default = "one Claude Code and one Codex" },
  { name = "milestone_reviewers", default = "one Claude Code" },
  { name = "skills", default = "deslop" },
]

[[snippet]]
title = "ultra deslop review"
text = "{snippet:· deslop} Review the entire repo for correctness and worthwhile improvements to simplicity, maintainability, and performance. Ground architectural recommendations in concrete benefits. Do not edit files."

[[snippet]]
title = "code review"
text = """
Review {target} without editing files or generating a fix.

Report every discrete, actionable issue introduced by the change that materially affects correctness, security, performance, or maintainability and warrants fixing at this repository's level of rigor. Verify the affected behavior; exclude speculative concerns, pre-existing issues, intentional changes, and trivial style. If no findings qualify, report none.

Apply the project instructions relevant to changed files, respecting their scope and precedence. Cite a verified instruction file when its repository-specific guidance materially supports a finding; ordinary correctness findings need no rule citation.

Use one finding per distinct issue:

### [Pn] <short imperative title>

Give the precise file and line location and one concise, factual paragraph explaining the trigger and impact. Quote only code needed to illustrate the issue.

Priorities:

- P0: Immediate action; blocks release, operations, or major usage regardless of input conditions.
- P1: Urgent; address in the next cycle.
- P2: Normal; fix eventually.
- P3: Low priority.

Finish with **Verdict: No blocking issues found | Blocking issues found**, a brief justification, and any material verification limits. Distinguish blocking defects from non-blocking findings; do not imply the review proves the absence of bugs.
"""
args = [{ name = "target", default = "Uncommitted changes" }]

[[snippet]]
title = "aaron-audit"
text = """
Audit the entire codebase for materially useful simplifications in data structures, state representation, control flow, algorithms, and ownership.

Use read-only inspection commands. Do not edit files, run tests, implement recommendations, commit, or push. Keep the coverage checklist in agent context and the final response, not a file.

Inventory identifiable subsystems with concrete boundaries and key files. Inspect each subsystem's implementation, interfaces, major call sites, and existing tests. Record either recommendations or an explicit skip for each. Delegate bounded, non-overlapping reviews when useful; independently verify delegated findings before accepting them.

Look for invalid state combinations, duplicated branching or shape assumptions, unclear ownership, unnecessarily repeated transformations or lookups, and lifecycle or concurrency models that allow contradictory state. Prefer clear local code over abstractions that merely relocate complexity. Reject changes justified only by style, hypothetical extensibility, or minor line-count reduction.

For each recommendation, explain the current complexity, proposed simplification, and concrete benefit with file and line evidence. Include the smallest credible scope, material risks, required validation, and confidence.

Before finishing, check coverage, verify findings against the current code, remove duplicates and weak recommendations, and resolve ownership overlaps. Use independent review where it helps resolve uncertainty. Continue until every identified subsystem is reviewed; disclose any inaccessible areas rather than claiming complete coverage.

Return the coverage checklist and recommendations ranked by impact, confidence, effort, blast radius, and dependencies. Identify useful first implementation slices.
"""

[[snippet]]
title = "squash to main"
text = """
Land this worktree's changes onto the local main branch as a single squashed commit:

1. Commit any remaining changes belonging to this task on the worktree branch. If unrelated changes prevent a clean task-only squash, stop and report.
2. Find the main checkout with `git worktree list`; confirm it is on main and clean. If dirty, stop and report.
3. From that checkout (`git -C <path> ...`), run `git merge --squash <worktree-branch>`, resolve conflicts, and create one commit summarizing the entire change.
4. Verify with `git -C <path> log -1 --stat`.

Do not push or delete the worktree or its branch.
"""

