[[snippet]]
title = "concrete impl plan"
text = """
Turn this into a concrete implementation plan.

To avoid slop, make sure the plan take these carefully into account:
<anti-slop-guidelines>
  <implementation>
  - Don't consider backwards compatibility or add any fallbacks or migrations (there are no users or deployments to worry about)
  - Don't overengineer solutions, or add _unecessary_ abstraction or indirection where a simpler, cleaner and more clear solution would do
  - Prefer elegant and readable code over comments when the code can speak for itself
    - Use clear naming and structure so intent is obvious — don't paper over confusing code with comments
  - Don't add defensive guards or null checks for states that are unlikely to happen
  - Don't add unnecessary type casts, aliases, or redefinitions — respect the existing source of truth
  - Don't leave placeholder logic, debug leftovers, or deprecated paths behind
  - Keep tests focused on meaningful behavior; skip low-value tests and prefer direct coverage over mocks.
  - Trust internal code and framework guarantees; only test our own code.
  </implementation>
  <design>
  - Avoid shallow abstractions — if an interface is as complex as its implementation, inline it
  - Respect module boundaries — don't reach past a module's public API or dump unrelated code into "common"/shared modules
  - Keep dependency direction clean — domain/core logic shouldn't depend on UI, transport, persistence, or framework details
  - Avoid change amplification — if a small behavior change needs coordinated edits across many files, switches, or registries, the structure is wrong
  - Translate errors at module boundaries so infrastructure errors (DB, HTTP, filesystem) don't leak raw through higher-level APIs
  - Give mutable state a clear owner; don't create shared state that anyone can reach into
  - Avoid temporal coupling — don't require implicit invocation order or objects that are invalid until some init/setup method runs
  </design>
</anti-slop-guidelines>

The output must be a stand-alone handoff document that an independent agent implementer can execute without prior context. Include the relevant context explicitly rather than assuming the reader knows it.

If there scope questions or there is ambiguity that would materially change the implementation approach, ask
clarifying questions using the ask_question tool - before presenting the final plan. Otherwise, proceed and state the assumptions clearly.
Requirements for the plan:
- Summarize the problem being solved and the target outcome.
- Identify the relevant code areas, modules, or systems likely to be touched.
- Break the work into ordered implementation steps (but no commits or PRs mentioned)
- Call out important assumptions and decisions.
- Include a focused testing/verification section.
- Include any notable risks or non-goals only if they materially affect implementation.
- Include any .md files that needs to be updated
- Append the full `anti-slop-guidelines` section below verbatim under a `Constraints` heading
"""

[[snippet]]
title = "herdr impl"
text = """
implement this end-to-end now. make sure build, lints and tests pass.

Then run 4 $herdr agent reviews. 2 codex with /review and 2 with this prompt:
```
$deslop $ponytail:ponytail-review
scope: uncomitted changes
```

review, validate and implement the findings that are valid and worth doing for this.
then make sure build, lints and all tests pass again.
"""

[[snippet]]
title = "ultra review"
text = """
$deslop $ponytail-audit
Review scope: the entire repo.
Also review for architecture best-practices, modern idiomatic best practices, design, etc focusing on where we can make the code simpler, more maintainable, more performant, etc.
no edits."""


