name: Publish theme

on:
  push:
    branches: [main]
    paths:
      - theme/**
      - .github/workflows/publish-theme.yml
  workflow_dispatch:

concurrency:
  group: publish-theme
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Check generated files are current
        run: |
          node theme/build.ts
          git diff --exit-code

      - name: Publish if the version is new
        working-directory: theme/web
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already published"
          else
            npm publish
          fi
