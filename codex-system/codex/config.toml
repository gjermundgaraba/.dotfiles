developer_instructions = "When selecting a deferred tool from ALL_TOOLS, inspect its full name and argument declaration, then invoke its exact full identifier. For programmatic selection, require exactly one exact full-name match. Do not use broad substring matching or first-match fallbacks: a namespace may contain the operation name. If the intended tool remains unclear, inspect the candidates instead of guessing."

personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
plan_mode_reasoning_effort = "xhigh"
tool_output_token_limit = 25_000
suppress_unstable_features_warning = true
mcp_oauth_callback_port = 5_555
service_tier = "fast"
approvals_reviewer = "user"

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "weekly-limit"
]
session_picker_view = "comfortable"

[tui.keymap.chat]
increase_reasoning_effort = "ctrl-shift-t"
decrease_reasoning_effort = "ctrl-t"

[tui.keymap.global]
open_transcript = "ctrl-alt-t"
copy = "alt-c"

[features]
hooks = true
goals = true
prevent_idle_sleep = true
memories = false
chronicle = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
